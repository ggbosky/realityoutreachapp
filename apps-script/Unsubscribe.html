<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#fafafa;color:#0a0a0a;font:15px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:28px;max-width:460px;width:100%}
h1{font-size:20px;margin:0 0 8px}
p{color:#3f3f46;margin:8px 0}
button{background:#0a0a0a;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5}
.small{font-size:12px;color:#71717a;margin-top:18px}
</style>
</head>
<body>
<div class="card" id="data" data-c="<?= c ?>" data-t="<?= t ?>">
  <h1>Odhlášení z komunikace</h1>
  <div id="box">
    <? if (valid === 'yes') { ?>
      <p>Potvrďte prosím, že si nepřejete dostávat další e-maily.</p>
      <button id="go">Odhlásit se</button>
    <? } else { ?>
      <p>Odkaz je neplatný nebo neúplný. Odpovězte prosím na původní e-mail slovem <b>ODHLÁSIT</b> a vyřadíme vás ručně.</p>
    <? } ?>
  </div>
  <p class="small">Odesílatel: <?= identification ?></p>
</div>
<script>
var btn = document.getElementById('go');
if (btn) btn.onclick = function () {
  btn.disabled = true;
  google.script.run.withSuccessHandler(function (r) {
    document.getElementById('box').innerHTML = '<p>' + String(r.message).replace(/</g, '&lt;') + '</p>';
  }).withFailureHandler(function () {
    btn.disabled = false;
    document.getElementById('box').insertAdjacentHTML('beforeend', '<p>Nepodařilo se. Zkuste to prosím znovu nebo odpovězte na e-mail slovem ODHLÁSIT.</p>');
  }).publicUnsubscribe(document.getElementById('data').getAttribute('data-c'), document.getElementById('data').getAttribute('data-t'));
};
</script>
</body>
</html>
